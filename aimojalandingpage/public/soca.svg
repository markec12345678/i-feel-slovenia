<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="soca-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#009B3A"/>
      <stop offset="50%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00ff88"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#soca-grad)"/>
  <path d="M 0 250 Q 200 200 400 250 T 800 250" stroke="#ffffff" stroke-width="25" fill="none" opacity="0.5"/>
  <path d="M 0 300 Q 200 250 400 300 T 800 300" stroke="#ffffff" stroke-width="20" fill="none" opacity="0.4"/>
  <path d="M 0 350 Q 200 300 400 350 T 800 350" stroke="#ffffff" stroke-width="15" fill="none" opacity="0.3"/>
  <path d="M 0 400 Q 200 350 400 400 T 800 400" stroke="#ffffff" stroke-width="10" fill="none" opacity="0.2"/>
  <circle cx="150" cy="280" r="6" fill="#ffffff" opacity="0.8">
    <animate attributeName="cx" values="150;650;150" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="330" r="5" fill="#ffffff" opacity="0.6">
    <animate attributeName="cx" values="250;550;250" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="380" r="4" fill="#ffffff" opacity="0.5">
    <animate attributeName="cx" values="350;450;350" dur="6s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="570" text-anchor="middle" font-family="Inter,sans-serif" font-size="40" font-weight="bold" fill="white" opacity="0.95">Reka Soča</text>
</svg>
