<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="postojna-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d2d5a"/>
    </linearGradient>
    <linearGradient id="stalactite-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#d4a843"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#postojna-grad)"/>
  <path d="M 0 300 Q 200 250 400 300 T 800 300" stroke="#f4d03f" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M 0 350 Q 200 300 400 350 T 800 350" stroke="#f4d03f" stroke-width="2" fill="none" opacity="0.2"/>
  <polygon points="100,400 150,150 200,400" fill="url(#stalactite-grad)" opacity="0.6"/>
  <polygon points="250,400 300,100 350,400" fill="url(#stalactite-grad)" opacity="0.8"/>
  <polygon points="400,400 450,120 500,400" fill="url(#stalactite-grad)" opacity="0.7"/>
  <polygon points="550,400 600,180 650,400" fill="url(#stalactite-grad)" opacity="0.5"/>
  <circle cx="300" cy="450" r="8" fill="#00ff88" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="480" r="6" fill="#00ff88" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="400" y="570" text-anchor="middle" font-family="Inter,sans-serif" font-size="40" font-weight="bold" fill="white" opacity="0.95">Postojnska jama</text>
</svg>
